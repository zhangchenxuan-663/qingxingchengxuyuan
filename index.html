  const posts=[
    {title:"程序员的精神内耗，大多来自这3件事",date:"2026-10-08",excerpt:"干这行久了才发现，最累的不是加班，是躺床上脑子还在转。我踩过的三个内耗坑，都写在这儿了。",url:"posts/post-01.html"},
    {title:"为什么你越努力，反而越焦虑？",date:"2026-10-08",excerpt:"学了一个多月啥也没学会，越学越慌。后来才想明白，是我把回报的标准定得太急了。",url:"posts/post-02.html"},
    {title:"程序员35岁危机，是真是假？怎么破",date:"2026-10-08",excerpt:"35岁危机是真的，但跟你想象的“一道坎”不是一回事。想清楚这笔账，就没什么好怕的。",url:"posts/post-03.html"},
    {title:"加班是不是职场PUA？技术人该怎么看",date:"2026-10-08",excerpt:"加班分两种：有事必须你上的是一种，别人没走你不好意思走的是另一种。",url:"posts/post-04.html"},
    {title:"程序员怎么避免无效加班",date:"2026-10-08",excerpt:"加了班想不起干了啥，这种白加的班，我后来躲掉了。",url:"posts/post-05.html"},
    {title:"Java后端开发，到底该掌握哪些东西",date:"2026-10-08",excerpt:"刚入行别照着培训机构的课程表猛学，语言、框架、数据三块打牢，先能独立干活再说。",url:"posts/post-06.html"},
    {title:"技术人该走管理岗，还是技术专家路线",date:"2026-10-09",excerpt:"该带人还是该钻技术？别在网上问，问自己做哪个不累，再看公司有没有那条路。",url:"posts/post-07.html"},
    {title:"程序员跳槽前，先想清楚这5件事",date:"2026-10-09",excerpt:"跳槽前我先把五件事写下来再决定动不动，上次就是这么拦住一次冲动裸辞的。",url:"posts/post-08.html"},
    {title:"程序员一天的有效工作时间，其实只有4小时",date:"2026-10-09",excerpt:"坐十一个小时，真正写代码的时间一天也就四个小时，剩下的都被切碎了。",url:"posts/post-09.html"},
    {title:"用AI写代码，会不会让自己失业",date:"2026-10-10",excerpt:"AI写代码是挺快，但它交的活我还是逐行审，分页那个坑就是这么揪出来的。",url:"posts/post-10.html"},
    {title:"程序员怎么提升专注力，对抗碎片化",date:"2026-10-10",excerpt:"等编译那几十秒手就摸手机，注意力就是这么碎掉的，几招笨办法收回来。",url:"posts/post-11.html"},
    {title:"工作忙到没时间成长？问题出在这",date:"2026-10-10",excerpt:"说没时间成长的人，下班其实有两三个小时，只是都刷进短视频里了。",url:"posts/post-12.html"},
    {title:"被裁了怎么办？程序员的职业缓冲带",date:"2026-10-11",excerpt:"同样被裁，有人慌了三个月，有人两周就挑好了下家，差的是平时铺的那层缓冲。",url:"posts/post-13.html"},
    {title:"程序员健康：久坐、颈椎、睡眠，别等身体报警",date:"2026-10-11",excerpt:"我不是医生，就聊聊自己久坐、颈椎、睡不好这几年是怎么一点点调过来的。",url:"posts/post-14.html"},
    {title:"大厂还是小厂？程序员选offer的底层逻辑",date:"2026-10-11",excerpt:"别问大厂小厂哪个好，先问自己这两年最缺规范、舞台还是稳定。",url:"posts/post-15.html"},
    {title:"技术债务不只是代码问题，也是心态问题",date:"2026-10-12",excerpt:"技术债多半不是写烂的，是当初一个个'先凑合'的决定攒出来的。",url:"posts/post-16.html"},
    {title:"程序员怎么高效自学一门新技术",date:"2026-10-12",excerpt:"学新技术别从啃文档开始，先跑通demo，再带着问题回头看书。",url:"posts/post-17.html"},
    {title:"写代码写到怀疑人生？你可能职业倦怠了",date:"2026-10-12",excerpt:"打开IDE就烦、干完活没成就感，可能不是懒，是身体在亮红灯。",url:"posts/post-18.html"},
    {title:"程序员的第一份工作，怎么选不后悔",date:"2026-10-13",excerpt:"第一份工作多两千块，我用了三年才还回来，这钱真不能只看薪资。",url:"posts/post-19.html"},
    {title:"远程办公、自由职业，程序员真的适合吗",date:"2026-10-13",excerpt:"远程自由不是逃离现在的解药，先在家试三个月，再决定要不要辞职。",url:"posts/post-20.html"},
    {title:"为什么你的代码总被review出问题",date:"2026-10-13",excerpt:"代码老被review挑毛病，多半不是技术差，是你没站在评审者的角度想问题。",url:"posts/post-21.html"},
    {title:"程序员沟通能力，为什么比技术还重要",date:"2026-10-14",excerpt:"技术决定你能不能进门，沟通决定你能走到哪一层，这事我是亲眼被刺激过的。",url:"posts/post-22.html"},
    {title:"面试被问“为什么离开上家”，怎么答不踩坑",date:"2026-10-14",excerpt:"被问为什么离开上家，骂前公司是雷，一句个人原因也是雷，照实讲想法最稳。",url:"posts/post-23.html"},
    {title:"程序员理财：别只会存死工资",date:"2026-10-14",excerpt:"程序员工资不低却存不下钱？先攒应急金、记账、发工资先转一笔走。",url:"posts/post-24.html"},
    {title:"过完35岁，程序员的路到底在哪",date:"2026-10-15",excerpt:"35岁不是断崖是分岔口，提前想好被优化时你靠什么吃饭，比啥都强。",url:"posts/post-25.html"},
    {title:"新手程序员最常犯的10个错误",date:"2026-10-15",excerpt:"带过几届新人后发现，大家栽的坑高度重复。这十条我基本都踩过，挑一条最扎心的先改。",url:"posts/post-26.html"},
    {title:"程序员要不要做副业？怎么开始不踩坑",date:"2026-10-15",excerpt:"副业不靠意志力，靠雷打不动的时间。每天挤不出一小时，先别开始，先解决主业的痛。",url:"posts/post-27.html"},
    {title:"技术人的时间管理：把一天过出两倍效率",date:"2026-10-16",excerpt:"程序员最缺的不是技术，是整块不被打断的时间。把脑子最清醒的两小时，留给深活。",url:"posts/post-28.html"},
    {title:"AI时代，程序员的核心竞争力是什么",date:"2026-10-16",excerpt:"只会写代码的程序员在贬值，能解决问题的人更值钱。关键看你把本事押在哪一头。",url:"posts/post-29.html"},
    {title:"上班如上坟？你和工作的关系该重新审视",date:"2026-10-16",excerpt:"周一睁眼就叹气，先分清是这地方烂还是你人倦了。环境的问题靠换，状态的问题靠养。",url:"posts/post-30.html"},
    {title:"谷歌75%代码由AI生成，普通程序员慌什么",date:"2026-10-18",excerpt:"那串数字拆开看，AI 顶掉的是重复活，放大的是人的判断力。该慌的不是它，是只会敲接口的你。",url:"posts/post-31.html"},
    {title:"不会用AI的程序员，正在被会用AI的淘汰",date:"2026-10-18",excerpt:"同一个需求，有人翻文档翻一天，有人中午就出初稿。差距不在写代码，在会不会用工具。",url:"posts/post-32.html"},
    {title:"手写代码的时代过去了，程序员的护城河在哪",date:"2026-10-18",excerpt:"代码几秒钟就能生成，光会写代码撑不起分量了。值钱的是把事想清楚、把老系统兜住。",url:"posts/post-33.html"},
    {title:"技术贬值焦虑：深耕多年的人，为什么也开始动摇",date:"2026-10-19",excerpt:"背了三年的参数，AI 三秒答得比你全。别怕，知识会贬值，手上练出来的本事不会。",url:"posts/post-34.html"},
    {title:"2026程序员真正累的不是加班，是这3件事",date:"2026-10-19",excerpt:"睡到中午还是累，那是心累。无意义的忙、说了不算、看不到成长，比加班更熬人。",url:"posts/post-35.html"},
    {title:"转行还是深耕？年轻人躲35岁危机的两种走法",date:"2026-10-19",excerpt:"转行还是深耕不是对错题，是合不合适。拿不准就先主业深耕着，业余小步试另一条道。",url:"posts/post-36.html"},
    {title:"程序员副业变现：五条实在的路子，从哪条开始",date:"2026-10-20",excerpt:"接单、写内容、做小工具、咨询、卖模板——五条路各有适合的人，别贪多，先把一条做出结果。",url:"posts/post-63.html"},
    {title:"程序员接单怎么不亏：平台怎么选、报价怎么定",date:"2026-10-20",excerpt:"选渠道先看门槛、结款和口碑，报价把隐性时间算进去，定金收够、范围写清，才能不亏。",url:"posts/post-64.html"},
    {title:"程序员写技术文章/教程怎么变现：流量主、付费内容、约稿",date:"2026-10-20",excerpt:"写作变现三条路：流量主攒小钱、付费内容收信任、约稿赚效率，顺序别搞反。",url:"posts/post-65.html"},
    {title:"程序员做的小工具/开源项目怎么被人发现：从零到有人用",date:"2026-10-21",excerpt:"项目没人用，九成是没人知道你做了。真问题、30秒看懂、送到对的人面前，三步走。",url:"posts/post-66.html"},
    {title:"程序员技术咨询/一对一辅导怎么接、怎么收费",date:"2026-10-21",excerpt:"单子靠长期输出攒信任，价格按自己的时薪和边界定，别贱卖也别开无限次，两类单先别接。",url:"posts/post-67.html"},
    {title:"副业变现的坑：哪些钱先别急着赚",date:"2026-10-21",excerpt:"先交钱的培训、搬运倒卖、透支口碑的帮忙、押上主业的活、赌运气的快钱——五类坑先认清再谈赚钱。",url:"posts/post-68.html"},
    {title:"用AI越多越不会写代码？\"认知债务\"怎么破",date:"2026-10-21",excerpt:"AI帮你省时间，别让它替你长本事。读透AI生成、留手写时间、重要代码先自己写，三条规矩守住手艺。",url:"posts/post-37.html"},
    {title:"公司发Token当工资，程序员的新内卷来了",date:"2026-10-22",excerpt:"发额度是让你提效，不是让你刷kpi。别被额度焦虑带跑，把产出当唯一标尺，警惕工具替代投入的话术。",url:"posts/post-38.html"},
    {title:"一边信AI一边骂AI，程序员的\"分裂感\"从哪来",date:"2026-10-22",excerpt:"分裂感来自两个自己在打架：把工具和混为一谈。把AI当算力不当对手，白天用晚上练，跟昨天的自己比。",url:"posts/post-39.html"},
    {title:"2026程序员的头等技能：指挥AI，不是写代码",date:"2026-10-22",excerpt:"代码在贬值，判断在升值。把需求讲清楚、会拆活、把住质量关、承担后果，四件事AI替你不了。",url:"posts/post-40.html"},
    {title:"83%的人在用AI，只有少数人敢让它做决定",date:"2026-10-23",excerpt:"多数人只敢用AI的手，少数人敢用它的脑。给它完整问题、逼它给反方观点，签字权永远在自己。",url:"posts/post-41.html"},
    {title:"代码评审占了大半时间，AI时代的工作变了",date:"2026-10-23",excerpt:"写变便宜了，审变贵了。把看代码当核心技术练，给AI定好边界，你就是团队里说了算的那个人。",url:"posts/post-42.html"},
    {title:"AI 编程工具怎么选：主力 Copilot 还是别家，我踩过的坑",date:"2026-10-23",excerpt:"工具迁移上瘾、迷信贵的、让它自由发挥——三个坑我都踩过。主力选一个用熟的，其余看看就好。",url:"posts/post-43.html"},
    {title:"2026 程序员该盯的 3 个技术趋势",date:"2026-10-24",excerpt:"AI编程干整活、Agent真跑、云边混合部署——三个趋势里，跟你的活沾边的那个才值得深耕。",url:"posts/post-44.html"},
    {title:"AI Agent 落地：做出来是一回事，跑稳是另一回事",date:"2026-10-24",excerpt:"Demo都漂亮，一上线现原形。划边界、做兜底、全程监控、持续迭代——会带Agent的人最吃香。",url:"posts/post-45.html"},
    {title:"为什么有的公司上了 AI 又悄悄撤了",date:"2026-10-24",excerpt:"撤的不是AI，是没想清楚怎么用。为了上而上、买了不落地、账算不过来——能帮公司避坑的人才稀缺。",url:"posts/post-46.html"},
    {title:"开源是程序员的底牌：读代码、写代码、交朋友",date:"2026-10-25",excerpt:"开源是最好的学习场、最硬的作品集、最实在的社交场。从读代码到写代码再到交朋友，越给越多。",url:"posts/post-47.html"},
    {title:"简历写“精通XXX”，可能反而减分",date:"2026-10-25",excerpt:"精通俩字写上去，面试官是真追问。用真实项目撑技能，数字、难点、怎么扛过来，比十个形容词都值钱。",url:"posts/post-48.html"},
    {title:"面试聊项目：怎么把做过的事讲清楚",date:"2026-10-25",excerpt:"别按流水账，按目标-难点-方案-结果讲。面试官要看你怎么解决真问题，不是点了多少功能。",url:"posts/post-49.html"},
    {title:"技术人怎么开口谈薪、谈涨薪",date:"2026-10-26",excerpt:"别拿缺钱当筹码，摆成绩、报区间、约正式时间。不谈，就是默认自己只值这么多。",url:"posts/post-50.html"},
    {title:"被约谈绩效，先想清楚这三件事",date:"2026-10-26",excerpt:"先对事实、再对目标、最后谈条件。被约谈不是末日，是你重新给自己定价的机会。",url:"posts/post-51.html"},
    {title:"试用期怎么快速站稳脚跟",date:"2026-10-26",excerpt:"搞懂规则、证明能用、敢于提问、主动对齐。试用期不是表现期，是适应期。",url:"posts/post-52.html"}
  ];
