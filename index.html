  <div class="hero">
    <h1>程序员，先别急着写代码<br>先把自己理顺</h1>
    <p>这里不谈框架和语法，只谈技术人最容易被忽略的东西：职业倦怠、精神内耗、成长路径、怎么把日子过明白。</p>
  </div>

  <div class="list" id="posts"></div>

  <footer>
    <p>清醒程序员 · 持续更新 · 把日子过明白，把工作干明白</p>

<script>
  const posts=[
    {title:"程序员的精神内耗，大多来自这3件事",date:"2026-10-08",excerpt:"加班、技术焦虑、三十五岁恐慌……程序员的内耗，往往不是能力问题，而是注意力放错了地方。",url:"posts/post-01.html"},
    {title:"为什么你越努力，反而越焦虑？",date:"2026-10-08",excerpt:"努力本身不会让你焦虑，让焦虑的是'努力必须有即时回报'的执念。",url:"posts/post-02.html"},
    {title:"程序员35岁危机，是真是假？怎么破",date:"2026-10-08",excerpt:"市场不淘汰35岁的人，市场淘汰'用3年经验重复了10年'的人。",url:"posts/post-03.html"},
    {title:"加班是不是职场PUA？技术人该怎么看",date:"2026-10-08",excerpt:"判断加班的唯一标准：这件事值不值得你花掉这段时间。",url:"posts/post-04.html"},
    {title:"程序员怎么避免无效加班",date:"2026-10-08",excerpt:"加班买不来成长，只有'把事情做成'才能。",url:"posts/post-05.html"},
    {title:"Java后端开发，到底该掌握哪些东西",date:"2026-10-08",excerpt:"技能清单是地图，不是终点。语言、框架、数据三块打牢，先能独立干活。",url:"posts/post-06.html"},
    {title:"技术人该走管理岗，还是技术专家路线",date:"2026-10-09",excerpt:"管理不是升职，是换了一份工作；专家不是终点，是一条更长的路。",url:"posts/post-07.html"},
    {title:"程序员跳槽前，先想清楚这5件事",date:"2026-10-09",excerpt:"跳槽的本质是投资自己，不是换个地方继续耗。想清楚再动，动就动得值。",url:"posts/post-08.html"},
    {title:"程序员一天的有效工作时间，其实只有4小时",date:"2026-10-09",excerpt:"你不是没时间，你是把最值钱的时间，花在了最不值钱的事情上。",url:"posts/post-09.html"},
    {title:"用AI写代码，会不会让自己失业",date:"2026-10-10",excerpt:"AI不会让你失业，让你失业的，是你在AI面前毫无差异化的能力。",url:"posts/post-10.html"},
    {title:"程序员怎么提升专注力，对抗碎片化",date:"2026-10-10",excerpt:"专注不是不被打扰，而是被打扰之后，能更快地回来。",url:"posts/post-11.html"},
    {title:"工作忙到没时间成长？问题出在这",date:"2026-10-10",excerpt:"忙不是没时间成长的借口，而是你一直没把成长当回事的结果。",url:"posts/post-12.html"},
    {title:"被裁了怎么办？程序员的职业缓冲带",date:"2026-10-11",excerpt:"缓冲带的作用不是防止摔倒，而是让你摔倒后还能稳稳站起来。",url:"posts/post-13.html"},
    {title:"程序员健康：久坐、颈椎、睡眠，别等身体报警",date:"2026-10-11",excerpt:"身体不会因为你有 deadline 就推迟报警。照顾好自己，才是最长远的投资。",url:"posts/post-14.html"},
    {title:"大厂还是小厂？程序员选offer的底层逻辑",date:"2026-10-11",excerpt:"选offer不是选一个名字，是选一段两三年的人生怎么过。",url:"posts/post-15.html"},
    {title:"技术债务不只是代码问题，也是心态问题",date:"2026-10-12",excerpt:"技术债务还的是代码，欠的是判断。管好自己的判断，债务就少一半。",url:"posts/post-16.html"},
    {title:"程序员怎么高效自学一门新技术",date:"2026-10-12",excerpt:"自学不是拼时长，是拼方法。方法对了，一个月顶别人三个月。",url:"posts/post-17.html"},
    {title:"写代码写到怀疑人生？你可能职业倦怠了",date:"2026-10-12",excerpt:"倦怠不是终点，是身体给你的导航：它提醒你，方向该调一调了。",url:"posts/post-18.html"},
    {title:"程序员的第一份工作，怎么选不后悔",date:"2026-10-13",excerpt:"第一份工作选的不是公司，是你在行业里的起点和姿态。",url:"posts/post-19.html"},
    {title:"远程办公、自由职业，程序员真的适合吗",date:"2026-10-13",excerpt:"远程和自由不是解药，是一种选择。适合的人如鱼得水，不适合的人只是换了一种内耗方式。",url:"posts/post-20.html"},
    {title:"为什么你的代码总被review出问题",date:"2026-10-13",excerpt:"评审意见不是对你能力的判决，是对代码风险的清单。清单越少，说明你把风险提前处理得越好。",url:"posts/post-21.html"},
    {title:"程序员沟通能力，为什么比技术还重要",date:"2026-10-14",excerpt:"代码决定你能不能干活，沟通决定你能干多大的活。",url:"posts/post-22.html"},
    {title:"面试被问"为什么离开上家"，怎么答不踩坑",date:"2026-10-14",excerpt:"离职原因没有标准答案，但有统一底线：不贬低过去，不掩饰诉求，把未来讲清楚。",url:"posts/post-23.html"},
    {title:"程序员理财：别只会存死工资",date:"2026-10-14",excerpt:"理财的第一步不是赚多少，是别乱花、别踩坑、别裸奔。",url:"posts/post-24.html"},
    {title:"过完35岁，程序员的路到底在哪",date:"2026-10-15",excerpt:"35岁危机的本质，不是年龄到了，而是能力、积蓄、方向这三样里，你至少一样没准备好。",url:"posts/post-25.html"},
    {title:"新手程序员最常犯的10个错误",date:"2026-10-15",excerpt:"新手期的差距，不在智商，在习惯。把这10个坑填平，你就已经超过一半的同行。",url:"posts/post-26.html"},
    {title:"程序员要不要做副业？怎么开始不踩坑",date:"2026-10-15",excerpt:"副业的本质，是把你多出来的时间和技能，变成第二份收入。没有余力，就没有副业。",url:"posts/post-27.html"},
    {title:"技术人的时间管理：把一天过出两倍效率",date:"2026-10-16",excerpt:"时间管理不是把24小时塞满，是把最重要的时间，留给最重要的事。",url:"posts/post-28.html"},
    {title:"AI时代，程序员的核心竞争力是什么",date:"2026-10-16",excerpt:"AI拉低了写代码的门槛，也抬高了做好软件的门槛。门槛抬高的那一端，站着的是人。",url:"posts/post-29.html"},
    {title:"上班如上坟？你和工作的关系该重新审视",date:"2026-10-16",excerpt:"工作是你生活的一部分，不是全部。你和工作的关系，不该是坟，该是合作。",url:"posts/post-30.html"},
    {title:"谷歌75%代码由AI生成，普通程序员慌什么",date:"2026-10-18",excerpt:"谷歌75%的新增代码由AI生成，普通程序员慌什么？冷静拆一拆：该慌的不是AI，是只会写代码的自己。",url:"posts/post-31.html"},
    {title:"不会用AI的程序员，正在被会用AI的淘汰",date:"2026-10-18",excerpt:"AI不会淘汰程序员，但会用AI和不会用AI的程序员，差距正在越拉越大。",url:"posts/post-32.html"},
    {title:"手写代码的时代过去了，程序员的护城河在哪",date:"2026-10-18",excerpt:"代码正在变成便宜货，程序员的护城河不再是写得快，而是判断力、系统感和协作力。",url:"posts/post-33.html"},
    {title:"技术贬值焦虑：深耕多年的人，为什么也开始动摇",date:"2026-10-19",excerpt:"知识会贬值，能力不会。深耕多年的人，手里的牌比想象中多。",url:"posts/post-34.html"}
  ];
  const el=document.getElementById('posts');
  el.innerHTML=posts.map(p=>`<div class="post"><h2><a href="${p.url}">${p.title}</a></h2><div class="meta">${p.date}</div><div class="excerpt">${p.excerpt}</div></div>`).join('');
